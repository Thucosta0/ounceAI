server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;
    root /usr/share/nginx/html;
    index index.html;

    # Otimização de Compressão (PageSpeed)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # 1. Arquivos Estáticos (JS, CSS, Imagens)
    # Servidos diretamente pelo Nginx para máxima performance e estabilidade
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Imagens e ícones na raiz do public
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|json)$ {
        expires 1w;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 2. API e Health Check
    # Encaminhados para o backend Flask
    location ~ ^/(api|health) {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. Rotas do React (SPA)
    # Qualquer outra rota cai no index.html para o React Router assumir
    location / {
        try_files $uri $uri/ /index.html;
    }
}
