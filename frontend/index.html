<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoounce.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OunceAI</title>
    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML += '<div style="color:red; background: black; padding: 20px; z-index: 9999; position: absolute; top:0; left:0; width: 100%; font-family: monospace;">' + 
          'Error: ' + event.message + '<br>' + 
          'File: ' + event.filename + '<br>' + 
          'Line: ' + event.lineno + 
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; background: black; padding: 20px; z-index: 9999; position: absolute; top:0; left:0; width: 100%; font-family: monospace;">' + 
          'Unhandled Promise Rejection: ' + event.reason + 
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
